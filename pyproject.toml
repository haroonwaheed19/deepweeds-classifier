[project]
name = "weedcls"
version = "0.1.0"
description = "DeepWeeds weed classifier: CPU-friendly training, evaluation and ONNX serving"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
