name: small_cnn
seed: 42
data_config: configs/data.yaml
norm: dataset          # dataset | imagenet
imbalance: weights     # weights | sampler | none
model:
  name: small_cnn
  img_size: 128
  dropout: 0.3
train:
  epochs: 16
  batch_size: 64
  lr: 3.0e-3
  weight_decay: 1.0e-4
  label_smoothing: 0.0
  patience: 5
  threads: 3
  subset_fraction: 1.0
